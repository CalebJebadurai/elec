<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070910" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Swings" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="description" content="Interactive analysis of Indian Assembly and General Elections. Explore constituency swing history, party trends, vote share data, and election predictions." />
    <title>Election Swings &amp; Trends</title>
    <script>
      (function(){
        // Keep in sync with src/lib/theme.ts. Applied before paint to avoid a flash.
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'dark' && t !== 'light' && t !== 'contrast') {
          t = window.matchMedia('(prefers-contrast: more)').matches ? 'contrast' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'light') document.documentElement.classList.remove('dark');
      })();
    </script>
    <script defer data-domain="%VITE_PLAUSIBLE_DOMAIN%" src="https://plausible.io/js/script.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
